name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install lint deps
        run: npm install --no-save js-yaml@^4.1.0
      - name: Lint registry.yaml (schema v1 + requiresMcps)
        run: node scripts/lint-registry.js
